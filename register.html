<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGen Digital | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #122028;
      --muted: #5f6f79;
      --paper: #f3f5f2;
      --white: #ffffff;
      --lime: #d9ea5b;
      --coral: #e57d63;
      --line: #d7dfd5;
      --shadow: 0 28px 70px rgba(18, 32, 40, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    a { color: inherit; text-decoration: none; }
    .topbar {
      height: 86px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 6vw; border-bottom: 1px solid rgba(18,32,40,.08);
      background: rgba(243,245,242,.92);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.8px;
    }
    .brand-mark {
      width: 31px; height: 31px; border-radius: 8px; background: var(--ink); color: var(--lime);
      display: grid; place-items: center; font-size: 15px; font-family: 'Space Grotesk', sans-serif;
    }
    .brand-dot { color: var(--coral); }
    .nav {
      display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 500;
    }
    .nav a:last-child {
      border: 1px solid var(--ink); padding: 11px 18px; border-radius: 6px;
    }

    .register-wrap {
      min-height: calc(100vh - 82px);
      display: grid; grid-template-columns: 1fr 1.15fr; align-items: center; padding: 6vh 10vw;
      gap: 4vw;
    }
    .left {
      align-self: center;
    }
    .left h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(46px, 5vw, 74px); margin: 0; line-height: 0.97; letter-spacing: -2px;
    }
    .left h1 em { color: var(--coral); font-style: normal; }
    .eyebrow {
      margin: 0 0 18px; font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--muted); font-weight: 700;
    }
    .left p {
      color: var(--muted); font-size: 17px; max-width: 380px; line-height: 1.6; margin-top: 20px;
    }

    .card {
      background: var(--white); box-shadow: var(--shadow); padding: 36px 34px; width: 100%; max-width: 620px; justify-self: center;
    }
    .card h2 {
      margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3vw, 40px); letter-spacing: -1px;
    }
    .muted {
      margin: 10px 0 24px; color: var(--muted); font-size: 14px;
    }
    form { display: grid; gap: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label {
      display: grid; gap: 7px; font-size: 13px; font-weight: 700;
    }
    select, input {
      width: 100%; border: 1px solid var(--line); background: #fbfcf9; color: var(--ink); padding: 13px 12px; font: 15px 'DM Sans', sans-serif; outline: none;
    }
    input:focus, select:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(217,237,98,.5); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 16px; width: 100%; border: none; padding: 15px 18px; font: 700 15px 'DM Sans', sans-serif; cursor: pointer; background: var(--ink); color: var(--white);
    }
    .btn:hover { background: #2d3b36; }
    .small-link {
      margin-top: 20px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .small-link a { color: var(--ink); font-weight: 700; text-decoration: underline; }
    small {
      color: var(--muted); font-size: 11px; margin-top: -8px;
    }
    @media (max-width: 760px) {
      .register-wrap { grid-template-columns: 1fr; padding: 30px 8vw; }
      .row { grid-template-columns: 1fr; }
      .card { padding: 26px 20px; }
      .nav a:not(:last-child) { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-mark">N</span>
      <span>NextGen Digital<span class="brand-dot">.</span></span>
    </a>
    <nav class="nav">
      <a href="index.html#about">About us</a>
      <a href="login.html">Sign in</a>
      <a href="register.html">Join the team</a>
    </nav>
  </header>

  <main class="register-wrap">
    <section class="left">
      <p class="eyebrow">Start here</p>
      <h1>Bring your<br><em>whole self.</em></h1>
      <p>Every good collaboration starts with a hello. Tell us a little about yourself and join the NextGen Digital team.</p>
    </section>

    <section class="card">
      <h2>Create your account</h2>
      <p class="muted">Create your employee account.</p>
      <form>
        <div class="row">
          <label>
            Full name
            <input type="text" name="name" placeholder="Avery Morgan" />
          </label>

          <label>
            Work email
            <input type="email" name="email" placeholder="name@company.com" />
          </label>
        </div>

        <div class="row">
          <label>
            Department
            <input type="text" name="department" placeholder="Product, Operations, Engineering" />
          </label>

          <label>
            Job title
            <input type="text" name="title" placeholder="Product Designer, Manager, Director" />
          </label>
        </div>

        <label>
          Phone number
          <input type="tel" name="phone" placeholder="+1 555 014 2020" />
        </label>

        <label>
          Password
          <input type="password" name="password" placeholder="Minimum 8 characters" />
          <small>Use at least 8 characters.</small>
        </label>

        <button class="btn" type="submit">Create account →</button>
      </form>

      <div class="small-link">Already have an account? <a href="login.php">Sign in</a></div>
    </section>
  </main>
</body>
</html>
