<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS ENTERPRISE | Directory Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0c0e12;
      --bg-card: #12151a;
      --border-card: #1f242c;
      --accent: #bef33e;
      --accent-hover: #d2fb5c;
      --text-white: #ffffff;
      --text-muted: #8c96a3;
      --text-light: #e6edf3;
      --btn-dark-bg: #181c22;
      --btn-dark-border: #29303c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-body);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      background: rgba(12, 14, 18, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-badge {
      background: var(--accent);
      color: #0c0e12;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.8px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 18px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid var(--btn-dark-border);
      background: var(--btn-dark-bg);
      color: #c9d1d9;
    }

    .nav-btn:hover {
      background: #222733;
      color: var(--text-white);
    }

    .shell {
      flex: 1;
      max-width: 1020px;
      width: 100%;
      margin: 40px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    /* Active Session Bar */
    .user-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-avatar {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: var(--accent);
      color: #0c0e12;
      font-size: 22px;
      font-weight: 800;
      display: grid;
      place-items: center;
    }

    .user-details h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .user-details p {
      color: var(--text-muted);
      font-size: 13.5px;
      margin-top: 4px;
    }

    .role-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
    }

    .role-admin {
      background: rgba(190, 243, 62, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .role-employee {
      background: rgba(99, 179, 237, 0.15);
      border: 1px solid #63b3ed;
      color: #63b3ed;
    }

    /* Condition Banner */
    .condition-banner {
      background: #10141a;
      border: 1px solid var(--border-card);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 16px 22px;
      font-size: 13.5px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .condition-banner strong {
      color: var(--accent);
    }

    /* Directory Cards Grid */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .section-header h3 {
      font-size: 22px;
      font-weight: 700;
    }

    .section-header span {
      background: #171c24;
      border: 1px solid var(--border-card);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .member-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 22px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member-card:hover {
      border-color: #313947;
      transform: translateY(-2px);
    }

    .member-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-avatar {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #1a202a;
      border: 1px solid var(--border-card);
      color: var(--accent);
      font-weight: 700;
      font-size: 17px;
      display: grid;
      place-items: center;
    }

    .member-name {
      font-size: 16px;
      font-weight: 700;
    }

    .member-title {
      font-size: 13px;
      color: var(--text-muted);
    }

    .member-meta {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .member-meta span strong {
      color: var(--text-light);
    }

    @media (max-width: 768px) {
      .navbar { padding: 14px 20px; flex-direction: column; gap: 12px; height: auto; }
      .user-banner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="brand" onclick="window.location.href='index.html'">
      <span class="brand-badge">NEXUS</span>
      <span class="brand-title">ENTERPRISE</span>
    </div>

    <nav class="nav-links">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="login.html" class="nav-btn" onclick="sessionStorage.clear()">Sign Out</a>
    </nav>
  </header>

  <main class="shell">
    
    <!-- User Banner -->
    <section class="user-banner">
      <div class="user-info">
        <div class="user-avatar" id="avatarBox">E</div>
        <div class="user-details">
          <h2>
            <span id="userName">Sam Rivera</span>
            <span class="role-badge role-employee" id="userRoleBadge">EMPLOYEE</span>
          </h2>
          <p id="userSub">Product Designer • Product Department</p>
        </div>
      </div>
      <div>
        <button class="nav-btn" onclick="toggleRoleSwitch()" style="font-size: 12.5px;">Switch Role View ⟳</button>
      </div>
    </section>

    <!-- Lab Condition Banner -->
    <div class="condition-banner" id="conditionNotice">
      <span>🎯</span>
      <span><strong>Lab Rule Active:</strong> You are logged in as an <span id="currentRoleText">Employee</span>. The system is showing you <strong>all Admin records</strong>.</span>
    </div>

    <!-- Directory Grid -->
    <div class="section-header">
      <h3 id="sectionTitle">Administrator Team Directory</h3>
      <span id="memberCount">2 Verified Records</span>
    </div>

    <div class="cards-grid" id="directoryGrid">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <script>
    const admins = [
      { name: "Avery Morgan", role: "Admin", title: "Chief Operating Officer", dept: "Operations", email: "admin@nextgendigital.test", phone: "+1 555 014 2020" },
      { name: "Marcus Chen", role: "Admin", title: "Head of Infrastructure & SecOps", dept: "Engineering", email: "marcus.chen@nexus.corp", phone: "+1 555 014 8832" }
    ];

    const employees = [
      { name: "Sam Rivera", role: "Employee", title: "Lead Product Designer", dept: "Product & UI", email: "employee@nextgendigital.test", phone: "+1 555 014 2021" },
      { name: "Elena Rostova", role: "Employee", title: "Senior Fullstack Engineer", dept: "Development", email: "elena.r@nexus.corp", phone: "+1 555 014 7710" },
      { name: "Devon Vance", role: "Employee", title: "Data Analyst & BI Specialist", dept: "Analytics", email: "devon.v@nexus.corp", phone: "+1 555 014 6219" }
    ];

    let currentRole = sessionStorage.getItem('nexus_role') || 'employee';

    function renderDashboard() {
      const avatarBox = document.getElementById('avatarBox');
      const userName = document.getElementById('userName');
      const userRoleBadge = document.getElementById('userRoleBadge');
      const userSub = document.getElementById('userSub');
      const currentRoleText = document.getElementById('currentRoleText');
      const conditionNotice = document.getElementById('conditionNotice');
      const sectionTitle = document.getElementById('sectionTitle');
      const memberCount = document.getElementById('memberCount');
      const grid = document.getElementById('directoryGrid');

      const customName = sessionStorage.getItem('nexus_name');
      const customDept = sessionStorage.getItem('nexus_dept');
      const customTitle = sessionStorage.getItem('nexus_title');

      if (currentRole === 'employee') {
        const displayName = customName || 'Sam Rivera';
        avatarBox.textContent = displayName.charAt(0).toUpperCase();
        avatarBox.style.background = '#63b3ed';
        avatarBox.style.color = '#0c0e12';
        userName.textContent = displayName;
        userRoleBadge.textContent = 'EMPLOYEE';
        userRoleBadge.className = 'role-badge role-employee';
        userSub.textContent = customTitle ? `${customTitle} • ${customDept || 'Department'}` : 'Product Designer • Product Department';
        
        currentRoleText.textContent = 'Employee';
        conditionNotice.innerHTML = `<span>🎯</span><span><strong>Lab Rule 1 Active:</strong> Logged in as an <em>Employee</em> — Authenticated successfully! Displaying <strong>all Admin details</strong>.</span>`;
        sectionTitle.textContent = 'Authorized Administrator Details';
        memberCount.textContent = `${admins.length} Admin Records`;

        grid.innerHTML = admins.map(a => `
          <div class="member-card">
            <div class="member-top">
              <div class="mini-avatar" style="color:var(--accent);">${a.name.charAt(0)}</div>
              <div>
                <div class="member-name">${a.name}</div>
                <div class="member-title">${a.title}</div>
              </div>
            </div>
            <div class="member-meta">
              <span>Department: <strong>${a.dept}</strong></span>
              <span>Work Email: <strong>${a.email}</strong></span>
              <span>Direct Phone: <strong>${a.phone}</strong></span>
            </div>
          </div>
        `).join('');

      } else {
        avatarBox.textContent = 'A';
        avatarBox.style.background = 'var(--accent)';
        avatarBox.style.color = '#0c0e12';
        userName.textContent = 'Avery Morgan';
        userRoleBadge.textContent = 'ADMIN';
        userRoleBadge.className = 'role-badge role-admin';
        userSub.textContent = 'Chief Operating Officer • Operations Department';

        currentRoleText.textContent = 'Admin';
        conditionNotice.innerHTML = `<span>🎯</span><span><strong>Lab Rule 2 Active:</strong> Logged in as an <em>Admin</em> — Authenticated successfully! Displaying <strong>all Employee details</strong>.</span>`;
        sectionTitle.textContent = 'Authorized Employee Directory';
        memberCount.textContent = `${employees.length} Employee Records`;

        grid.innerHTML = employees.map(e => `
          <div class="member-card">
            <div class="member-top">
              <div class="mini-avatar" style="color:#63b3ed;">${e.name.charAt(0)}</div>
              <div>
                <div class="member-name">${e.name}</div>
                <div class="member-title">${e.title}</div>
              </div>
            </div>
            <div class="member-meta">
              <span>Department: <strong>${e.dept}</strong></span>
              <span>Work Email: <strong>${e.email}</strong></span>
              <span>Direct Phone: <strong>${e.phone}</strong></span>
            </div>
          </div>
        `).join('');
      }
    }

    function toggleRoleSwitch() {
      currentRole = (currentRole === 'employee') ? 'admin' : 'employee';
      sessionStorage.setItem('nexus_role', currentRole);
      renderDashboard();
    }

    renderDashboard();
  </script>
</body>
</html>
